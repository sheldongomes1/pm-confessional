# Reproducible build + deploy for PM Confessional.
#
# One-time setup (Artifact Registry repo to hold the images):
#   gcloud artifacts repositories create pm-confessional \
#     --repository-format=docker --location="$REGION"
#
# Build & deploy (after the Cloud SQL instance + secrets exist — see deploy/DEPLOY.md):
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_SQL_CONN=PROJECT:us-central1:pmc-pg
#
# Images are tagged with the commit SHA so you can roll back to an exact build.

substitutions:
  _REGION: us-central1
  _SERVICE: pm-confessional
  _REPO: pm-confessional
  _SQL_CONN: ""           # PROJECT:REGION:INSTANCE — required at submit time
  _VITE_POSTHOG_KEY: "phc_uJptRPCmQXZrB5tPBUzSLd4gxR5qySJtiC6eYuxyTAQF"
  _VITE_POSTHOG_HOST: "https://us.i.posthog.com"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"

steps:
  # Build the image (PostHog keys are baked into the SPA at build time).
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "--build-arg=VITE_POSTHOG_KEY=${_VITE_POSTHOG_KEY}"
      - "--build-arg=VITE_POSTHOG_HOST=${_VITE_POSTHOG_HOST}"
      - "-t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - "-t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"
      - "."

  # Push both tags.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}"

  # Deploy the SHA-tagged image to Cloud Run.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--add-cloudsql-instances=${_SQL_CONN}"
      - "--set-env-vars=NODE_ENV=production,BASE_PATH=/,PUBLIC_DIR=/app/public,LOG_LEVEL=info,AI_INTEGRATIONS_ANTHROPIC_BASE_URL=https://api.anthropic.com,POSTHOG_PROJECT_ID=415646"
      - "--set-secrets=DATABASE_URL=DATABASE_URL:latest,AI_INTEGRATIONS_ANTHROPIC_API_KEY=AI_INTEGRATIONS_ANTHROPIC_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,POSTHOG_PERSONAL_API_KEY=POSTHOG_PERSONAL_API_KEY:latest"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=4"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8     # faster pnpm install + Vite build
