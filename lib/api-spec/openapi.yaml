openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PM Confessional API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: regrets
    description: Regret operations
  - name: leaderboard
    description: Leaderboard operations
  - name: ingest
    description: Data ingestion operations
  - name: coach
    description: Decision Coach agent operations
  - name: meta
    description: Methodology, audit stats, and public insights
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /regrets:
    get:
      operationId: listRegrets
      tags: [regrets]
      summary: List regrets with optional filters
      parameters:
        - name: topic_tag
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            type: string
        - name: guest_name
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of regrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRegretsResponse"

  /regrets/search:
    post:
      operationId: searchRegrets
      tags: [regrets]
      summary: Semantic search for relevant regrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRegretsBody"
      responses:
        "200":
          description: Matched regrets ranked by relevance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchRegretsResponse"

  /regrets/categories:
    get:
      operationId: getCategories
      tags: [regrets]
      summary: Get regret counts by topic tag and stage
      responses:
        "200":
          description: Category counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"

  /regrets/stats:
    get:
      operationId: getStats
      tags: [regrets]
      summary: Overall database statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

  /regrets/{id}:
    get:
      operationId: getRegret
      tags: [regrets]
      summary: Get a single regret by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A regret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Regret"
        "404":
          description: Not found

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get guests ranked by number of regrets shared
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"

  /ingest/status:
    get:
      operationId: getIngestStatus
      tags: [ingest]
      summary: Get current ingestion pipeline status
      responses:
        "200":
          description: Ingestion status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestStatus"

  /ingest/start:
    post:
      operationId: startIngest
      tags: [ingest]
      summary: Start the data ingestion pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartIngestBody"
      responses:
        "202":
          description: Ingestion started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestStatus"

  /coach/start:
    post:
      operationId: startCoachingSession
      tags: [coach]
      summary: Start a Decision Coach session grounded on a set of regrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCoachingSessionBody"
      responses:
        "200":
          description: Session started with opening message and clarifying questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartCoachingSessionResponse"

  /coach/{id}:
    get:
      operationId: getCoachingSession
      tags: [coach]
      summary: Load an existing coaching session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coaching session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingSession"
        "404":
          description: Not found

  /coach/{id}/reply:
    post:
      operationId: replyCoachingSession
      tags: [coach]
      summary: Send a user message and receive the agent's grounded response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyCoachingSessionBody"
      responses:
        "200":
          description: Updated session with new agent reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingSession"

  /methodology:
    get:
      operationId: getMethodology
      tags: [meta]
      summary: Audit stats for the public methodology page
      responses:
        "200":
          description: Methodology stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MethodologyResponse"

  /insights/public:
    get:
      operationId: getPublicInsights
      tags: [meta]
      summary: Public usage stats for the homepage footer (PostHog-backed when configured, otherwise local)
      responses:
        "200":
          description: Public insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInsightsResponse"

  /ingest/reextract:
    post:
      operationId: reextractRegrets
      tags: [ingest]
      summary: Re-extract regrets from cached transcript markdown
      description: >
        Re-runs the regret extractor against episodes that already have cached
        markdown. For episodes missing cached markdown (legacy rows scanned
        before the cache existed), the transcript is fetched from MCP and
        cached. Use this after iterating on the extractor prompt to refresh
        the dataset without paying the full ingestion cost.
      responses:
        "202":
          description: Re-extraction started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Regret:
      type: object
      properties:
        id:
          type: integer
        guest_name:
          type: string
        episode_title:
          type: string
        episode_date:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        stage:
          type: string
          enum: [early, growth, scale, general, unknown]
          description: "`unknown` is legacy and being phased out — new rows use `general`."
        topic_tag:
          type: string
          enum: [hiring, pricing, product, growth, culture, fundraising, timing, customers, other]
        regret_statement:
          type: string
        source_quote:
          type: string
        headline_evidence:
          type: ["string", "null"]
          description: Verbatim 8-40 word span from the transcript that proves the headline. Strictly more accurate than `source_quote` (which is the first 500 chars of an 800-word window).
        episode_url:
          type: ["string", "null"]
        relevance_score:
          type: ["number", "null"]
        created_at:
          type: string
      required:
        - id
        - guest_name
        - episode_title
        - stage
        - topic_tag
        - regret_statement
        - source_quote
        - created_at

    ListRegretsResponse:
      type: object
      properties:
        regrets:
          type: array
          items:
            $ref: "#/components/schemas/Regret"
        total:
          type: integer
      required:
        - regrets
        - total

    SearchRegretsBody:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
          default: 8
      required:
        - query

    SearchRegretsResponse:
      type: object
      properties:
        regrets:
          type: array
          items:
            $ref: "#/components/schemas/Regret"
        query:
          type: string
        match_count:
          type: integer
          description: Number of regrets above the rerank confidence threshold
        is_fallback:
          type: boolean
          description: True when the Gemini reranker was unavailable and pure cosine ranking was returned instead
        retrieval_mode:
          type: string
          enum: [vector_rerank, vector_only, keyword]
          description: Which pipeline produced the results
        rerank_model:
          type: string
          enum: [none, flash-lite, flash]
          description: Which Gemini model performed the rerank, if any
        top1_cosine:
          type: number
          description: Cosine similarity of the top-1 candidate (rounded to 2 decimals); useful for downstream confidence display
        low_confidence:
          type: boolean
          description: True when the top-1 cosine fell below LOW_CONFIDENCE_THRESHOLD; the response was rescued by full Flash rerank but quality may still be weak
      required:
        - regrets
        - query
        - match_count
        - is_fallback
        - retrieval_mode

    CategoryCount:
      type: object
      properties:
        label:
          type: string
        count:
          type: integer
      required:
        - label
        - count

    CategoriesResponse:
      type: object
      properties:
        by_topic:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        by_stage:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        by_year:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
      required:
        - by_topic
        - by_stage
        - by_year

    YearTopicCount:
      type: object
      properties:
        year:
          type: integer
        label:
          type: string
        count:
          type: integer
      required:
        - year
        - label
        - count

    YearCount:
      type: object
      properties:
        year:
          type: integer
        count:
          type: integer
      required:
        - year
        - count

    StatsResponse:
      type: object
      properties:
        total_regrets:
          type: integer
        total_guests:
          type: integer
        total_episodes:
          type: integer
        top_topics:
          type: array
          description: Top 3 most common confession types
          items:
            $ref: "#/components/schemas/CategoryCount"
        top_topic_by_year:
          type: array
          description: The #1 confession type for each year (sorted ascending)
          items:
            $ref: "#/components/schemas/YearTopicCount"
        most_candid_year:
          description: The year with the most confessions
          oneOf:
            - $ref: "#/components/schemas/YearCount"
            - type: "null"
        stage_distribution:
          type: array
          description: Confession counts by company stage
          items:
            $ref: "#/components/schemas/CategoryCount"
        rarest_topic:
          description: The least-discussed topic with at least one confession
          oneOf:
            - $ref: "#/components/schemas/CategoryCount"
            - type: "null"
        avg_regrets_per_guest:
          type: number
          description: Average number of confessions per guest
      required:
        - total_regrets
        - total_guests
        - total_episodes
        - top_topics
        - top_topic_by_year
        - most_candid_year
        - stage_distribution
        - rarest_topic
        - avg_regrets_per_guest

    LeaderboardEntry:
      type: object
      properties:
        guest_name:
          type: string
        regret_count:
          type: integer
        top_topics:
          type: array
          items:
            type: string
        episode_count:
          type: integer
      required:
        - guest_name
        - regret_count
        - top_topics
        - episode_count

    LeaderboardResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
      required:
        - entries

    IngestStatus:
      type: object
      properties:
        status:
          type: string
          enum: [idle, running, completed, failed]
        episodes_processed:
          type: integer
        regrets_extracted:
          type: integer
        message:
          type: ["string", "null"]
        started_at:
          type: ["string", "null"]
        completed_at:
          type: ["string", "null"]
      required:
        - status
        - episodes_processed
        - regrets_extracted

    StartCoachingSessionBody:
      type: object
      properties:
        decision:
          type: string
          description: The user's decision or situation (free text, max ~500 chars)
        regret_ids:
          type: array
          items:
            type: integer
          description: IDs of the regrets returned by /regrets/search to ground the coach on
      required:
        - decision
        - regret_ids

    CoachMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, model]
        content:
          type: string
      required:
        - role
        - content

    CoachingSession:
      type: object
      properties:
        id:
          type: integer
        user_decision:
          type: string
        regret_ids:
          type: array
          items:
            type: integer
        regrets:
          type: array
          items:
            $ref: "#/components/schemas/Regret"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CoachMessage"
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - user_decision
        - regret_ids
        - regrets
        - messages
        - created_at
        - updated_at

    StartCoachingSessionResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/CoachingSession"
      required:
        - session

    ReplyCoachingSessionBody:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    MethodologyResponse:
      type: object
      properties:
        total_audited:
          type: integer
        total_visible:
          type: integer
        total_flagged:
          type: integer
        flagged_breakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        verified_verbatim_pct:
          type: number
        extractor_v1_precision:
          type: number
          description: Initial loose-prompt extractor precision (e.g. 0.33)
        extractor_v2_precision:
          type: number
          description: Strict-prompt extractor precision after iteration (e.g. 0.90)
        episodes_scanned:
          type: integer
      required:
        - total_audited
        - total_visible
        - total_flagged
        - flagged_breakdown
        - verified_verbatim_pct
        - extractor_v1_precision
        - extractor_v2_precision
        - episodes_scanned

    PublicInsightsResponse:
      type: object
      properties:
        searches_this_week:
          type: ["integer", "null"]
        top_decision_today:
          type: ["string", "null"]
        coaching_sessions_total:
          type: integer
        source:
          type: string
          enum: [posthog, local, unavailable]
      required:
        - coaching_sessions_total
        - source

    StartIngestBody:
      type: object
      properties:
        limit_episodes:
          type: ["integer", "null"]
          description: Limit to N episodes (for testing). Null means all.
        sample_only:
          type: boolean
          default: false
          description: Run on sample of 10 episodes only
      required: []
